<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="logo">Spotify</div>
            <ul class="menu">
                <li>Home</li>
                <li>Search</li>
                <li>Your Library</li>
            </ul>
        </aside>
        <main class="main">
            <div class="header">
                <h2>Good Morning</h2>
            </div>
            <div class="songs" id="songList"></div>
        </main>
    </div>
    <div class="player">
        <div class="player-left">
            <img src="assets/imagens/SelvaRussa.jpg" width="50">
            <div>
                <div id="currentTitle">Song Name</div>
                <div id="currentArtist">Artist Name</div>
            </div>
        </div>
        <div class="player-center">
            <button onclick="prevSong()">⏮</button>
            <button id="playBtn">▶</button>
            <button onclick="nextSong()">⏭</button>
        </div>
        <div class="player-right">
            <input type="range" id="progress" value="0">
            <input type="range" id="volume" value="100" min="0" max="100">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
